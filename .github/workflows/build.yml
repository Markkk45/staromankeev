name: Build & Release Staromankeev

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── Android APK ──────────────────────────────────────────────
  build-android:
    name: "🤖 Android Release APK"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Ensure platform files
        run: flutter create --org com.staromankeev --project-name staromankeev .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ─── iOS Payload IPA (sideloading) ────────────────────────────
  build-ios:
    name: "🍎 iOS Payload IPA"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Ensure platform files
        run: flutter create --org com.staromankeev --project-name staromankeev .

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS
        run: |
          # Принудительно отключаем подпись в сгенерированном проекте
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj || true
          flutter build ios --no-codesign --release
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: "-"

      - name: Package Payload IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 staromankeev.ipa Payload/
          echo "✅ Payload IPA created: $(du -h staromankeev.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-payload-ipa
          path: staromankeev.ipa
          retention-days: 30

  # ─── GitHub Release ───────────────────────────────────────────
  release:
    name: "📦 Publish Release"
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: ./artifacts/android

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-payload-ipa
          path: ./artifacts/ios

      - name: Rename artifacts
        run: |
          mv ./artifacts/android/app-release.apk ./artifacts/staromankeev-release.apk
          mv ./artifacts/ios/staromankeev.ipa ./artifacts/staromankeev-payload.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Староманкеевский ${{ github.ref_name }}"
          body: |
            ## 📱 Староманкеевский язык — Релиз ${{ github.ref_name }}

            ### Артефакты сборки:
            - **Android**: `staromankeev-release.apk` — установить напрямую
            - **iOS**: `staromankeev-payload.ipa` — установить через SideStore / LiveContainer / AltStore

            ### Что внутри:
            - 🔤 Интерактивный словарь с поиском в реальном времени
            - ✂️ Генератор редукции слов по правилам языка
            - 📜 Алфавит с рукописными глифами

          files: |
            ./artifacts/staromankeev-release.apk
            ./artifacts/staromankeev-payload.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
